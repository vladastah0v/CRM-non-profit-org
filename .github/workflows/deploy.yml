name: Deploy

# п. 10.1 ТЗ: после успешного CI на main — автоматически на тестовое окружение;
# на рабочее — вручную, кнопкой «Run workflow» (в нерабочее время фонда).
# Секреты — в настройках окружений GitHub (Settings → Environments: test, production):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Для production включите «Required reviewers» — выпуск подтверждает ответственный.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [test, production]
        default: test
      ref:
        description: Тег или коммит (по умолчанию — последний на main)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Выпуск на ${{ github.event.inputs.environment || 'test' }}
    # Автовыпуск — только после push в main: CI запускается и на PR из форков с веткой main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'test' }}
    steps:
      - name: SSH-ключ
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выпуск
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          # REF попадает в команду на сервере: только имя тега или коммита, без кавычек и опций git
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "Недопустимый тег или коммит: $REF" >&2
            exit 1
          fi
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && sh scripts/deploy.sh '$REF'"
