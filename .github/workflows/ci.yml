name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy .
      - name: Миграции соответствуют моделям
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  test:
    name: Тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Проверка настроек безопасности prod
        # Ключ шифрования prod-настройки требуют при запуске. Для проверки — одноразовый,
        # сгенерированный здесь же: в репозитории ключей нет (НФТ-ИБ-10)
        run: |
          export FIELD_ENCRYPTION_KEYS="ci:$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-${{ github.sha }}-not-a-real-secret-key
          DJANGO_ALLOWED_HOSTS: crm.example.org
      - name: Аудит зависимостей
        run: pip install pip-audit && pip-audit -r requirements/base.txt -r requirements/bot.txt

  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          tags: crm-nko:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Образ Telegram-бота
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bot
          push: false
          tags: crm-nko-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
