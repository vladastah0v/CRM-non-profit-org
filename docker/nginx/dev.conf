# Локальная проверка прокси (http://localhost:8080). TLS — только на сервере.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=intake:10m rate=10r/m;

# Журнал доступа без строки запроса и Referer: в поиске и фильтрах (?q=...) бывают ФИО и
# телефоны. access_log задан в каждом server — он отменяет журнал «main» из nginx.conf образа.
log_format crm '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent $request_time';

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    server_tokens off;
    access_log /var/log/nginx/access.log crm;

    location = /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    # API Telegram-бота — только по внутренней сети Docker (бот → web:8000), не снаружи
    location /api/v1/bot/ {
        return 404;
    }

    location /api/v1/intake/ {
        limit_req zone=intake burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /admin/ {
        include /etc/nginx/snippets/security-headers-admin.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
    }
}
