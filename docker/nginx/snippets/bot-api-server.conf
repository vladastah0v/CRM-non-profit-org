# Внутренний вход для Telegram-бота (п. 7.2): http://nginx:8081/api/v1/bot/ из сети Docker
# «bot». Порт наружу не публикуется. Бот не подключён к web напрямую: иначе взломанный бот
# обошёл бы лимиты Nginx на вход и подставил бы в X-Real-IP чужой адрес (он попадает
# в журнал аудита). Отсюда к приложению проходит только API бота, X-Real-IP ставит Nginx.
# Подключается на уровне http в dev.conf и prod.conf.template — после upstream и log_format.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log crm;
    client_max_body_size 64k;  # бот присылает только короткий JSON

    location /api/v1/bot/ {
        # Приложение получает путь в том виде, в каком его прислал клиент, а location
        # проверяет уже нормализованный: «/admin/../api/v1/bot/» иначе дошёл бы до админки
        if ($request_uri !~ "^/api/v1/bot/") {
            return 404;
        }
        proxy_pass http://django;
        # Имя приложения во внутренней сети — оно есть в ALLOWED_HOSTS (config/settings)
        proxy_set_header Host web;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
