# Тест восстановления из копии (п. 5.4, 9.2 ТЗ): изолированный проект Compose, никаких
# рабочих данных. S3Mock — вместо S3-хранилища в РФ. Запуск: sh scripts/backup/restore-test.sh

x-walg: &walg
  POSTGRES_PASSWORD: restore-test
  TZ: Europe/Moscow
  WALG_S3_PREFIX: s3://backups/crm
  AWS_ACCESS_KEY_ID: restore-test
  AWS_SECRET_ACCESS_KEY: restore-test-secret
  AWS_ENDPOINT: http://s3:9090
  AWS_REGION: ru-central1
  AWS_S3_FORCE_PATH_STYLE: "true"
  # Шифрование копий (НФТ-ИБ-06). Ключ — одноразовый, его создаёт restore-test.sh при
  # каждом запуске: в репозитории ключей нет. На сервере — свой ключ из .env
  WALG_LIBSODIUM_KEY: ${RESTORE_TEST_KEY:?Запускайте через scripts/backup/restore-test.sh}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  WALG_COMPRESSION_METHOD: brotli

services:
  # S3-совместимое хранилище для теста (вместо S3 в РФ на сервере)
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: backups
      initialBuckets: backups
      # Отдача большой копии на медленном стенде дольше стандартного тайм-аута — иначе
      # S3Mock обрывает ответ («unexpected EOF» у WAL-G)
      SPRING_MVC_ASYNC_REQUEST_TIMEOUT: 15m

  db:
    build: ../../docker/postgres
    image: crm-db:16-walg
    environment: *walg
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
    volumes:
      - source:/var/lib/postgresql/data

  # Как на сервере (docker-compose.prod.yml): отдельный контейнер, база — по сети,
  # том данных — только для чтения
  backup:
    image: crm-db:16-walg
    profiles: [backup]
    environment:
      <<: *walg
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: restore-test
      PGDATABASE: postgres
    volumes:
      - source:/var/lib/postgresql/data:ro

  # Чистый «новый сервер»: пустой том, тот же образ и ключи
  restored:
    image: crm-db:16-walg
    profiles: [restore]
    environment: *walg
    volumes:
      - target:/var/lib/postgresql/data

volumes:
  source:
  target:
