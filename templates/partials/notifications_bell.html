{# Колокольчик уведомлений (ФТ-У-02). Счётчик — из контекст-процессора notifications #}
<a href="{% url 'notifications:list' %}" class="relative inline-flex rounded-md p-2 text-slate-700 hover:bg-slate-100 hover:text-slate-900"
   aria-label="Уведомления{% if unread_notifications %}: непрочитанных {{ unread_notifications }}{% endif %}">
  <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-4-5.7V5a2 2 0 10-4 0v.3A6 6 0 006 11v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
  </svg>
  {% if unread_notifications %}
    <span class="absolute -right-0.5 -top-0.5 inline-flex min-w-5 items-center justify-center rounded-full bg-red-600 px-1 text-xs font-semibold text-white" aria-hidden="true">{% if unread_notifications > 99 %}99+{% else %}{{ unread_notifications }}{% endif %}</span>
  {% endif %}
</a>
