{# Поле формы: {% include "partials/field.html" with field=form.name %} #}
<div>
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-red-600" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error" role="alert">{{ error }}</p>{% endfor %}
</div>
