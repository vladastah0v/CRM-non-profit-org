{# Флажок: {% include "partials/checkbox.html" with field=form.remove_photo %} #}
<div>
  <label for="{{ field.id_for_label }}" class="flex items-start gap-2 text-sm text-slate-700">
    {{ field }}
    <span>{{ field.label }}</span>
  </label>
  {% if field.help_text %}<p class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error" role="alert">{{ error }}</p>{% endfor %}
</div>
