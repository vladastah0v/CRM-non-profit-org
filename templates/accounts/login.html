{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <div class="mx-auto mt-8 max-w-sm">
    <h1 class="mb-6 text-center">Вход в CRM НКО</h1>
    <form method="post" class="card space-y-4" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">
          {% for error in form.non_field_errors %}{{ error }}{% endfor %}
        </div>
      {% endif %}
      <div>
        <label for="{{ form.username.id_for_label }}" class="form-label">Логин</label>
        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
               value="{{ form.username.value|default:'' }}" class="form-input" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
               class="form-input" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full">Войти</button>
    </form>
  </div>
{% endblock %}
