{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <div class="mx-auto mt-8 max-w-sm">
    <h1 class="mb-6 text-center">Вход в CRM НКО</h1>
    <form method="post" action="{% url 'accounts:login' %}" class="card space-y-4" novalidate>
      {% csrf_token %}
      {% include "partials/form_errors.html" %}
      <div>
        <label for="id_username" class="form-label">Логин</label>
        <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}"
               class="form-input" autocomplete="username" autocapitalize="none" required autofocus>
      </div>
      <div>
        <label for="id_password" class="form-label">Пароль</label>
        <input type="password" name="password" id="id_password" class="form-input"
               autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full">Продолжить</button>
      <p class="text-center text-xs text-slate-500">Дальше понадобится код из приложения-аутентификатора.</p>
    </form>
  </div>
{% endblock %}
